[package]
name = "agent-hub"
version = "0.2.6"
edition = "2021"
license = "MIT"
authors = ["Pengjie Zhou"]
description = "What an app tells other local apps of the agents' sessions it follows: the sessions known, each event as it comes (Server-Sent Events, missed ones sent again), behind a local token."
repository = "https://github.com/zhoupengjie/agent-hub"

[dependencies]
agent-core = { path = "../agent-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The hub's proof that it knows the token (proof: HMAC-SHA256); Wakuwaku has it already.
sha2 = "0.10"

# A token's file opened not following a link, nor waiting on a FIFO
# (read_token); a Tauri app has it already.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
